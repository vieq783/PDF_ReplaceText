name: Build Windows EXE

on:
  workflow_dispatch:        # cho phep bam nut Run workflow tren web
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --onefile --noconsole --clean --name PDFReplacer
          --exclude-module numpy --exclude-module matplotlib
          --exclude-module pandas --exclude-module scipy
          pdf_replacer_gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PDFReplacer
          path: dist/PDFReplacer.exe
